name: Full CI/CD Pipeline

on:
  push:
    branches: [master]

jobs:
  sast:
    name: Static Analysis (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install bandit
      
      # SAST анализ
      - name: Run Bandit (SAST)
        run: |
          bandit -r . -f json -o bandit-report.json || true

      # Загрузка отчёта в DefectDojo
      - name: Upload Bandit report to DefectDojo
        env:
          DD_TOKEN: ${{ secrets.DD_TOKEN }}
        run: |
          echo "Uploading Bandit scan result to DefectDojo..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://185.178.44.115:8080/api/v2/import-scan/ \
            -H "Authorization: Token $DD_TOKEN" \
            -F "file=@bandit-report.json" \
            -F "scan_type=Bandit Scan" \
            -F "engagement=2" \
            -F "minimum_severity=Low" \
            -F "active=true" \
            -F "verified=true")

          if [ "$RESPONSE" -eq "201" ]; then
            echo "✅ Report uploaded successfully"
          else
            echo "❌ Failed to upload report to DefectDojo. HTTP Status: $RESPONSE"
            exit 1
          fi

      - name: Upload Trivy artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-reports/report.json

  security-checks:
    name: Security Checks (Dependencies/Images)
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install wget apt-transport-https gnupg lsb-release -y
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy -y

      - name: Run Trivy (filesystem scan)
        run: |
          mkdir -p trivy-reports
          trivy fs --format json -o trivy-reports/report.json . || true

      - name: Upload Trivy report to DefectDojo
        run: |
          curl -X POST "http://185.178.44.115:8080/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DD_TOKEN }}" \
            -H "Content-Type: multipart/form-data" \
            -F "scan_type=Trivy Scan" \
            -F "file=@trivy-reports/report.json" \
            -F "engagement=2" \
            -F "active=true" \
            -F "verified=true"

      - name: Upload Trivy artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-reports/report.json

  dast:
    name: Dynamic Analysis (DAST)
    runs-on: ubuntu-latest
    needs: security-checks
    steps:
      - uses: actions/checkout@v4

      - name: Run OWASP ZAP Full Scan
        run: |
          docker run --rm \
            -u root \
            -v $(pwd):/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py \
            -t http://185.178.44.115:8080 \
            -r zap-report.html \
            -x zap-report.xml || true

      - name: Upload ZAP report to DefectDojo
        env:
          DD_TOKEN: ${{ secrets.DD_TOKEN }}
        run: |
          echo "Uploading scan result to DefectDojo..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://185.178.44.115:8080/api/v2/import-scan/ \
            -H "Authorization: Token $DD_TOKEN" \
            -F "file=@zap-report.xml" \
            -F "scan_type=ZAP Scan" \
            -F "engagement=1" \
            -F "minimum_severity=Low" \
            -F "active=true" \
            -F "verified=true")

          if [ "$RESPONSE" -eq "201" ]; then
            echo "✅ Report uploaded successfully"
          else
            echo "❌ Failed to upload report to DefectDojo. HTTP Status: $RESPONSE"
            exit 1
          fi

      - name: Upload ZAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap_report.html

  gateway:
    name: Security Gateway
    runs-on: ubuntu-latest
    needs: dast
    steps:
      - uses: actions/checkout@v4

      - name: Download Bandit artifact
        uses: actions/download-artifact@v4
        with:
          name: bandit-report
          path: reports

      - name: Download Trivy artifact
        uses: actions/download-artifact@v4
        with:
          name: trivy-report
          path: reports

      - name: Download ZAP artifact
        uses: actions/download-artifact@v4
        with:
          name: zap-report
          path: reports

      - name: Check for critical vulnerabilities
        run: |
          echo "=== Checking Trivy ==="
          TRIVY_CRIT=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' reports/report.json || echo 0)
          echo "Trivy critical vulnerabilities: $TRIVY_CRIT"

          echo "=== Checking Bandit ==="
          BANDIT_CRIT=$(jq '[.results[] | select(.issue_severity == "HIGH")] | length' reports/bandit-report.json || echo 0)
          echo "Bandit critical (HIGH) issues: $BANDIT_CRIT"

          echo "=== Checking ZAP ==="
          ZAP_CRIT=$(grep -ci "High" reports/zap_report.html || echo 0)
          echo "ZAP critical (High) issues: $ZAP_CRIT"

          TOTAL=$((TRIVY_CRIT + BANDIT_CRIT + ZAP_CRIT))
          echo "Total critical vulnerabilities: $TOTAL"
          if [ "$TOTAL" -gt 0 ]; then
            echo "❌ Blocking deployment due to critical vulnerabilities."
            exit 1
          fi

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: gateway
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH private key
        run: |
          echo "${{ secrets.SSH_KEY }}" > private_key
          chmod 600 private_key

      - name: Deploy to VPS
        run: |
          ssh -i private_key -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ~/django-DefectDojo
            git fetch origin
            git reset --hard origin/master
            docker compose pull
            docker compose down
            docker compose up -d
          EOF
