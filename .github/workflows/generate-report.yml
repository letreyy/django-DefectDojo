name: Security Gateway

on:
  workflow_run:
    workflows: ["SAST Scan"]
    types:
      - completed

jobs:
  security-gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Check DefectDojo for Critical Vulnerabilities
        run: |
          echo "🔍 Checking DefectDojo for critical vulnerabilities..."
          
          API_URL="http://185.178.44.115:8080/api/v2/findings/?severity=Critical&active=true&verified=true&limit=1000"
          AUTH_HEADER="Authorization: Token ${{ secrets.DD_TOKEN }}"
          
          RESPONSE=$(curl -s -H "$AUTH_HEADER" "$API_URL")
          CRITICAL_COUNT=$(echo "$RESPONSE" | jq '[.results[] | select(.test.engagement == 1 or .test.engagement == 2 or .test.engagement == 3)] | length')

          echo "Critical vulnerabilities found: $CRITICAL_COUNT"

          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "❌ Found $CRITICAL_COUNT critical vulnerabilities in engagements 1, 2, or 3. Blocking deployment."
            exit 1
          fi

          echo "✅ No critical vulnerabilities found. Proceeding."
