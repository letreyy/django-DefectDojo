name: Security Gateway

on:
  push:
    branches:
      - master

jobs:
  security-gateway:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Устанавливаем Trivy
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      # Запуск Trivy
      - name: Run Trivy scan
        run: |
          mkdir -p trivy-reports
          trivy fs --format json --output trivy-reports/report.json .

      # Загружаем отчет в DefectDojo (Engagements 1, 2, 3)
      - name: Upload report to DefectDojo
        run: |
          for ENG in 1 2 3; do
            curl -X POST "http://185.178.44.115:8080/api/v2/import-scan/" \
              -H "Authorization: Token ${{ secrets.DD_TOKEN }}" \
              -H "Content-Type: multipart/form-data" \
              -F "scan_type=Trivy Scan" \
              -F "file=@trivy-reports/report.json" \
              -F "engagement=$ENG" \
              -F "active=true" \
              -F "verified=true"
          done

      # Проверка на критические уязвимости
      - name: Check for critical vulnerabilities
        run: |
          CRITICAL_COUNT=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-reports/report.json)
          echo "Critical vulnerabilities: $CRITICAL_COUNT"
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "❌ Found $CRITICAL_COUNT critical vulnerabilities. Blocking deployment."
            exit 1
          fi

      # Добавляем отчет в summary
      - name: Add scan results to summary
        run: |
          CRITICAL_COUNT=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-reports/report.json)
          echo "### Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "Critical vulnerabilities: $CRITICAL_COUNT" >> $GITHUB_STEP_SUMMARY
