name: Security Gateway

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  security-gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Run Trivy scan
        run: |
          mkdir -p trivy-reports
          trivy fs --security-checks vuln --format json -o trivy-reports/report.json .

      - name: Debug Trivy Report
        run: |
          echo "=== Vulnerabilities Found ==="
          cat trivy-reports/report.json | jq '.Results[].Vulnerabilities[]? | {VulnerabilityID, Severity, Title}' || echo "No vulnerabilities found."

      - name: Check for High and Critical vulnerabilities
        id: vuln-check
        run: |
          CRITICAL_COUNT=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH")] | length' trivy-reports/report.json)
          echo "High + Critical vulnerabilities: $CRITICAL_COUNT"
          echo "critical_count=$CRITICAL_COUNT" >> $GITHUB_OUTPUT
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "❌ Found $CRITICAL_COUNT High or Critical vulnerabilities. Blocking deployment."
            exit 1
          fi

      - name: Generate vulnerability summary
        if: always()
        run: |
          echo "## Vulnerability Summary" >> $GITHUB_STEP_SUMMARY
          jq -r '.Results[].Vulnerabilities[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH") | "- \(.VulnerabilityID) (\(.Severity)): \(.Title)"' trivy-reports/report.json | head -n 5 >> $GITHUB_STEP_SUMMARY
          CRITICAL_COUNT=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH")] | length' trivy-reports/report.json)
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total High + Critical vulnerabilities:** $CRITICAL_COUNT" >> $GITHUB_STEP_SUMMARY
