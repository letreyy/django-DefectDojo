name: CI/CD with Security Gateway

on:
  push:
    branches: [master]

jobs:
  security-gateway:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install wget -y
          wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.50.4_Linux-64bit.deb
          sudo dpkg -i trivy_0.50.4_Linux-64bit.deb

      # Сканируем код на CRITICAL уязвимости для Engagement 1
      - name: Scan (Engagement 1)
        run: |
          trivy fs --severity CRITICAL --format json -o critical_eng1.json .
          echo "# Critical Vulnerabilities Report (Engagement 1)" > critical_report_engagement_1.md
          jq '.Results[] | select(.Vulnerabilities) | .Vulnerabilities[] | select(.Severity=="CRITICAL") | "- " + .PkgName + " (" + .InstalledVersion + ") CVE: " + .VulnerabilityID' critical_eng1.json >> critical_report_engagement_1.md || echo "No critical vulnerabilities found." >> critical_report_engagement_1.md

      # Сканируем код на CRITICAL уязвимости для Engagement 2
      - name: Scan (Engagement 2)
        run: |
          trivy fs --severity CRITICAL --format json -o critical_eng2.json .
          echo "# Critical Vulnerabilities Report (Engagement 2)" > critical_report_engagement_2.md
          jq '.Results[] | select(.Vulnerabilities) | .Vulnerabilities[] | select(.Severity=="CRITICAL") | "- " + .PkgName + " (" + .InstalledVersion + ") CVE: " + .VulnerabilityID' critical_eng2.json >> critical_report_engagement_2.md || echo "No critical vulnerabilities found." >> critical_report_engagement_2.md

      # Сканируем код на CRITICAL уязвимости для Engagement 3
      - name: Scan (Engagement 3)
        run: |
          trivy fs --severity CRITICAL --format json -o critical_eng3.json .
          echo "# Critical Vulnerabilities Report (Engagement 3)" > critical_report_engagement_3.md
          jq '.Results[] | select(.Vulnerabilities) | .Vulnerabilities[] | select(.Severity=="CRITICAL") | "- " + .PkgName + " (" + .InstalledVersion + ") CVE: " + .VulnerabilityID' critical_eng3.json >> critical_report_engagement_3.md || echo "No critical vulnerabilities found." >> critical_report_engagement_3.md

      # Загружаем отчёты как артефакты
      - name: Upload Critical Reports
        uses: actions/upload-artifact@v4
        with:
          name: critical-vulnerabilities-reports
          path: |
            critical_report_engagement_1.md
            critical_report_engagement_2.md
            critical_report_engagement_3.md

      # Добавляем все отчёты в Summary
      - name: Add reports to summary
        run: |
          echo "## Critical Vulnerabilities Summary" >> $GITHUB_STEP_SUMMARY
          echo "### Engagement 1" >> $GITHUB_STEP_SUMMARY
          cat critical_report_engagement_1.md >> $GITHUB_STEP_SUMMARY
          echo -e "\n---\n" >> $GITHUB_STEP_SUMMARY
          echo "### Engagement 2" >> $GITHUB_STEP_SUMMARY
          cat critical_report_engagement_2.md >> $GITHUB_STEP_SUMMARY
          echo -e "\n---\n" >> $GITHUB_STEP_SUMMARY
          echo "### Engagement 3" >> $GITHUB_STEP_SUMMARY
          cat critical_report_engagement_3.md >> $GITHUB_STEP_SUMMARY
