name: Security Gateway

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  security-gateway:
    name: Run Security Gateway
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install wget apt-transport-https gnupg lsb-release -y
          wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.50.4_Linux-64bit.deb
          sudo apt install -y ./trivy_0.50.4_Linux-64bit.deb

      - name: Run Trivy Scan
        run: |
          mkdir -p trivy-reports
          trivy fs --exit-code 0 --severity HIGH,CRITICAL --format json -o trivy-reports/report.json .

      - name: Upload to DefectDojo Engagement 1
        run: |
          curl -X POST "http://185.178.44.115:8080/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DD_TOKEN }}" \
            -F "engagement=1" \
            -F "scan_type=Trivy Scan" \
            -F "file=@trivy-reports/report.json" \
            -F "active=true" \
            -F "verified=true"

      - name: Upload to DefectDojo Engagement 2
        run: |
          curl -X POST "http://185.178.44.115:8080/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DD_TOKEN }}" \
            -F "engagement=2" \
            -F "scan_type=Trivy Scan" \
            -F "file=@trivy-reports/report.json" \
            -F "active=true" \
            -F "verified=true"

      - name: Upload to DefectDojo Engagement 3
        run: |
          curl -X POST "http://185.178.44.115:8080/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DD_TOKEN }}" \
            -F "engagement=3" \
            -F "scan_type=Trivy Scan" \
            -F "file=@trivy-reports/report.json" \
            -F "active=true" \
            -F "verified=true"

      - name: Check Critical Vulnerabilities
        run: |
          CRITICAL_COUNT=$(jq '[.Results[].Vulnerabilities[] | select(.Severity == "CRITICAL")] | length' trivy-reports/report.json)
          echo "Critical vulnerabilities: $CRITICAL_COUNT"
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "❌ Found $CRITICAL_COUNT critical vulnerabilities. Blocking deployment."
            exit 1
          fi

      - name: Upload Trivy Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-reports/report.json
