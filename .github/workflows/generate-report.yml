name: CI/CD with Security Gateway

on:
  push:
    branches: [master]

jobs:
  security-gateway:
    name: Security Gateway Check
    runs-on: ubuntu-latest

    steps:
      - name: Check DefectDojo for Critical Vulnerabilities
        run: |
          echo "Checking DefectDojo engagements 1, 2, and 3 for Critical vulnerabilities..."

          check_engagement() {
            ENG=$1
            RESPONSE=$(curl -s -X GET "http://185.178.44.115:8080/api/v2/findings/?engagement=${ENG}&severity=Critical&active=true" \
              -H "Authorization: Token ${{ secrets.DD_TOKEN }}")

            COUNT=$(echo "$RESPONSE" | jq '.count')
            echo "Engagement ${ENG}: Critical=${COUNT}"

            if [ "$COUNT" -gt 0 ]; then
              echo "❌ Found critical vulnerabilities in engagement ${ENG}:"
              echo "$RESPONSE" | jq -r '.results[].title'
              exit 1
            fi
          }

          check_engagement 1
          check_engagement 2
          check_engagement 3

          echo "✅ No critical vulnerabilities found in engagements 1, 2, or 3."

  generate-report:
    name: Generate Critical Vulnerabilities Report
    runs-on: ubuntu-latest
    needs: security-gateway
    if: always()

    steps:
      - name: Fetch Critical Vulnerabilities
        run: |
          echo "# Critical Vulnerabilities Report" > critical_report.md
          echo "" >> critical_report.md

          fetch_engagement() {
            ENG=$1
            RESPONSE=$(curl -s -X GET "http://185.178.44.115:8080/api/v2/findings/?engagement=${ENG}&severity=Critical&active=true" \
              -H "Authorization: Token ${{ secrets.DD_TOKEN }}")

            COUNT=$(echo "$RESPONSE" | jq '.count')
            echo "## Engagement ${ENG}" >> critical_report.md
            echo "Critical vulnerabilities found: ${COUNT}" >> critical_report.md
            echo "" >> critical_report.md

            if [ "$COUNT" -gt 0 ]; then
              echo "$RESPONSE" | jq -r '.results[].title' | sed 's/^/- /' >> critical_report.md
              echo "" >> critical_report.md
            fi
          }

          fetch_engagement 1
          fetch_engagement 2
          fetch_engagement 3

      - name: Upload Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: critical-vulnerabilities-report
          path: critical_report.md

  deploy:
    name: Deploy to VPS
    needs: security-gateway
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH private key
        run: |
          echo "${{ secrets.SSH_KEY }}" > private_key
          chmod 600 private_key

      - name: Deploy to VPS
        run: |
          ssh -i private_key -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ~/django-DefectDojo
            git reset --hard origin/master
            docker compose pull
            docker compose down
            docker compose up -d
          EOF
