name: Security Gateway

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  security-gateway:
    name: Security Gateway Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Run Trivy Scan
        run: |
          mkdir -p trivy-reports
          trivy fs --format json --output trivy-reports/report.json .

      - name: Check Critical Vulnerabilities
        id: check_vulns
        run: |
          CRITICAL_COUNT=$(jq '[.Results[]?.Vulnerabilities? // [] | .[] | select(.Severity == "CRITICAL")] | length' trivy-reports/report.json)
          echo "Critical vulnerabilities: $CRITICAL_COUNT"
          echo "CRITICAL_COUNT=$CRITICAL_COUNT" >> $GITHUB_ENV
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "❌ Found $CRITICAL_COUNT critical vulnerabilities. Blocking deployment."
            exit 1
          fi

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-reports/report.json

      - name: Add Summary
        if: always()
        run: |
          echo "### Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Critical vulnerabilities found:** $CRITICAL_COUNT" >> $GITHUB_STEP_SUMMARY
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "- **Status:** ❌ Deployment blocked due to critical vulnerabilities" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status:** ✅ No critical vulnerabilities found" >> $GITHUB_STEP_SUMMARY
