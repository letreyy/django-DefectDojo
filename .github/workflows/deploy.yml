name: CI/CD Deploy to DefectDojo VPS

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          echo "${{ secrets.SSH_KEY }}" > private_key
          chmod 600 private_key

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i private_key -o StrictHostKeyChecking=no root@${{ secrets.SSH_HOST }} << 'EOF'
            cd /root/django-DefectDojo
            git fetch origin
            git reset --hard origin/master
            docker-compose pull
            docker-compose down
            docker-compose up -d
          EOF
